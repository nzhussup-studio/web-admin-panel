name: Web Admin Panel CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "admin-panel/**"
      - ".github/workflows/cicd.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admin-panel/**"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Run Web Admin Panel Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: admin-panel

      - name: Run Tests
        run: npm test
        working-directory: admin-panel

  build:
    name: Build Web Admin Panel Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VITE_API_BASE=${{ vars.API_BASE }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/web-admin-panel:latest \
            --push .
        working-directory: admin-panel

  deploy:
    name: Deploy Web Admin Panel to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: SSH and Rollout Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            kubectl rollout restart deployment/web-admin-panel
